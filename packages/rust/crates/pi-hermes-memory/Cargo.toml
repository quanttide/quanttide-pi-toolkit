[package]
name = "pi-hermes-memory"
version = "0.1.0"
edition = "2021"
description = "pi-hermes-memory 扩展的只读数据访问适配（sessions.db 会话与记忆）"
license = "Apache-2.0"
repository = "https://github.com/quanttide/quanttide-pi-toolkit"
readme = "README.md"
keywords = ["quanttide", "pi-agent", "hermes-memory"]
categories = ["development-tools"]

[lib]
name = "pi_hermes_memory"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
quanttide-pi = { version = "0.1.0", path = "../.." }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
